site: jack-window-cleaning
turnstileSiteKey: 0x4AAAAAAFHtLCWg1S7IznJp
umamiWebsiteId: 59dbc856-65e1-48c3-95b4-07777e6c3982
umamiScriptUrl: https://analytics.weaverdigital.io/script.js
contactCollection: inquiries
collections:
  - name: posts
    label: Posts
    path: content/posts
    format: yaml-frontmatter
    view:
      primary: title
      sort: date
    fields:
      - name: title
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: date
        type: date
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: heroImage
        type: image
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: body
        type: rich-text
        required: false
        hidden: false
        readonly: false
        isBody: true
    form: false
  - name: inquiries
    label: Inquiries
    path: content/inquiries
    format: yaml
    fields:
      - name: name
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: email
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: message
        type: text
        required: true
        hidden: false
        readonly: false
        isBody: false
    form: true
    workflow:
      states:
        - name: new
          label: New
          kind: needs-you
          hidden: false
        - name: open
          label: Open
          kind: needs-you
          hidden: false
        - name: waiting
          label: Waiting on customer
          kind: waiting
          hidden: false
        - name: done
          label: Done
          kind: closed
          hidden: false
        - name: archived
          label: Archived
          kind: closed
          hidden: true
  - name: packages
    label: Service Packages
    description: The cleaning packages shown on the Services page.
    path: content/packages
    format: yaml
    view:
      primary: title
      sort: order
    fields:
      - name: title
        type: string
        required: true
      - name: tagline
        type: string
      - name: price
        type: string
        label: Price (e.g. "From $149")
        required: true
      - name: features
        type: text
        label: Features (one per line)
      - name: featured
        type: boolean
        label: Highlight as most popular
      - name: order
        type: number
        label: Sort order
