site: jack-window-cleaning
turnstileSiteKey: 0x4AAAAAAFHtLCWg1S7IznJp
umamiWebsiteId: 59dbc856-65e1-48c3-95b4-07777e6c3982
umamiScriptUrl: https://analytics.weaverdigital.io/script.js
contactCollection: inquiries
collections:
  - name: posts
    label: Posts
    path: content/posts
    format: yaml-frontmatter
    view:
      primary: title
      sort: date
    fields:
      - name: title
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: date
        type: date
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: heroImage
        type: image
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: body
        type: rich-text
        required: false
        hidden: false
        readonly: false
        isBody: true
    form: false
  - name: inquiries
    label: Quote Requests
    description: Quote requests from the contact page.
    path: content/inquiries
    format: yaml
    form: true
    fields:
      - name: name
        type: string
        required: true
      - name: email
        type: string
        required: true
      - name: phone
        type: string
        label: Phone
      - name: service
        type: string
        label: Package of interest
      - name: message
        type: text
        label: Tell us about your windows
        required: true
    workflow:
      states:
        - name: new
          label: New
          kind: needs-you
        - name: quoted
          label: Quoted
          kind: waiting
        - name: booked
          label: Booked
          kind: closed
        - name: spam
          label: Spam
          kind: closed
          hidden: true
  - name: packages
    label: Service Packages
    description: The cleaning packages shown on the Services page.
    path: content/packages
    format: yaml
    view:
      primary: title
      sort: order
    fields:
      - name: title
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: tagline
        type: string
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: price
        type: string
        label: Price (e.g. "From $149")
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: features
        type: text
        label: Features (one per line)
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: featured
        type: boolean
        label: Highlight as most popular
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: order
        type: number
        label: Sort order
        required: false
        hidden: false
        readonly: false
        isBody: false
    form: false
